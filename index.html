<!DOCTYPE html> <!-- This tells the browser thatthis document is written in modern HTML5 so it can render age orrectly-->
<html lang="en"> <!-- This is th root element that wraps the entire web page and the lang tells browsers that the language o the page is eglish-->
<head> <!-- this is just a container for all the metadatat that doesnt get shown on screen but tells browser how to handle things-->
    <meta charset="UTF-8"> <!-- this sets the character encoding to UTF 8 which lets the browser support almost all standard letters, numbers, etc-->
    <meta name="viewport" content=""width=device-width, initial-scle="1.0"> <!-- this line is very important for having a mobile friendly design as it makes sure to scale the page properly on phones, etc-->
    <title>Password Generator</title> <!-- this is just the title that is shown on the browser tab in your window-->
    <link rel="stylesheet" href="style.css"> <!-- this just connects your external CSS file to the HTML file so the browser knows how to style the elements-->
</head>
<body> <!--this is the body section is is all of the vsuual content-->

    <div class="container">
        <h2>Password Generator</h2>

        <div class ="result-container">
            <span id="result">Click generate</span>
        </div>

        <div class = "setting">
            <label for="lengt">Password Length</label>
            <input type="number" id="length" min = "1" max = "50" value ="12">
        </div>

        <div class="setting">
            <label for="lowercase">Include Lowercase</label>
            <input type="checkbox" id="lowercase" checked>
        </div>

        <div class="setting">
            <label for="uppercase">Include Uppercase</label>
            <input type ="checkbox" id="uppercase" checked>
        </div>

        <div class="setting">
            <label for="numbers">Include Numbers</label>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="setting">
            <label for="symbols">Include Symbols</label>
            <input type="checkbox" id="symbols" checked>
        </div>

        <button class="btn" id="generate">Generate Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
